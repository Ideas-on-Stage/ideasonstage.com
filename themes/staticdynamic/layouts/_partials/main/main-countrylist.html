{{/* <!--
	
	body-countrylist.html

	Generates the HTML for a list of site countries (matching the different languages).
	The countries must be defined in site.Params.countries
	
	Arguments:
	- anything (argugment is mandatory but not used)
	
--> */}}

<aside id="country-list" class="cl-main-countrylist">
	<ul>
		{{- range hugo.Sites -}}
			{{- $href := .Home.RelPermalink -}}
			{{- $label := .Language.Label -}}
			{{- if ne true .Params.isHidden -}}
				<li>
					<a href="{{ $href }}" class="cl-core--button-secondary">
						{{ $label }}
					</a>
				</li>
			{{- end -}}
		{{- end }}
	</ul>
</aside>
